<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Bulk Link Extractor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; padding: 2rem 0; }
    .container { max-width: 700px; }
    textarea { font-family: monospace; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="container">
  <h2 class="text-center mb-4">🔗 YouTube Bulk Link Extractor</h2>
  
  <div class="card shadow-sm p-4 mb-3">
    <label class="form-label fw-bold">Paste Messy Text / Links Below:</label>
    <textarea id="rawInput" class="form-control mb-3" rows="6" placeholder="Paste anything here: whole web page text, playlists, WhatsApp messages, short links (youtu.be)..."></textarea>
    <button id="extractBtn" class="btn btn-primary w-100 fw-bold">Extract Clean Links</button>
  </div>

  <div id="outputCard" class="card shadow-sm p-4 d-none">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="fw-bold" id="linkCount">0 Links Found</span>
      <button id="copyBtn" class="btn btn-success btn-sm">📋 Copy All</button>
    </div>
    <textarea id="cleanOutput" class="form-control" rows="8" readonly></textarea>
  </div>
</div>

<script>
  const rawInput = document.getElementById('rawInput');
  const extractBtn = document.getElementById('extractBtn');
  const outputCard = document.getElementById('outputCard');
  const cleanOutput = document.getElementById('cleanOutput');
  const linkCount = document.getElementById('linkCount');
  const copyBtn = document.getElementById('copyBtn');

  extractBtn.addEventListener('click', () => {
    const text = rawInput.value;
    
    // Matches standard youtube.com/watch?v= ID and short links youtu.be/ ID
    const regex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/g;
    
    const matches = [];
    let match;
    
    while ((match = regex.exec(text)) !== null) {
      matches.push(`https://www.youtube.com/watch?v=${match[1]}`);
    }

    // Deduplicate
    const uniqueLinks = [...new Set(matches)];

    if (uniqueLinks.length === 0) {
      alert('No valid YouTube video links found in the text.');
      outputCard.classList.add('d-none');
      return;
    }

    cleanOutput.value = uniqueLinks.join('\n');
    linkCount.textContent = `✅ ${uniqueLinks.length} Unique Links Extracted`;
    outputCard.classList.remove('d-none');
  });

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(cleanOutput.value).then(() => {
      const originalText = copyBtn.textContent;
      copyBtn.textContent = 'Copied!';
      setTimeout(() => copyBtn.textContent = originalText, 1500);
    });
  });
</script>

</body>
</html>
